{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block body %}
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <h1>Samahani — something went wrong</h1>
  <p class="muted">{{ msg }}</p>
  <div class="row" style="justify-content:center;margin-top:22px">
    <a class="btn alt" href="{{ url_for('index') }}">Back to home</a>
    <a class="btn ghost" href="{{ url_for('outbreak_map') }}">Outbreak map</a>
  </div>
</div>
{% endblock %}
