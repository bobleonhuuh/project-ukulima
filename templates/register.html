{% extends "base.html" %}
{% block title %}{{ t('nav.signup') }}{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>{{ t('auth.register_title') }}</h1>
    <p class="muted">Free for farmers. New accounts start as farmer accounts.</p>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label for="name">{{ t('auth.name') }}</label>
      <input id="name" type="text" name="name" required autocomplete="name" autofocus>

      <label for="email">{{ t('auth.email') }}</label>
      <input id="email" type="email" name="email" required autocomplete="email">

      <label for="phone">{{ t('auth.phone') }}</label>
      <input id="phone" type="tel" name="phone" autocomplete="tel" placeholder="07xx xxx xxx">

      <label for="county">{{ t('report.county') }}</label>
      <select id="county" name="county">
        <option value="">— Select —</option>
        {% for c in counties %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
      </select>

      <label for="password">{{ t('auth.password') }}</label>
      <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password">
      <div class="hint">At least 8 characters.</div>

      <button class="btn block mt" type="submit">{{ t('nav.signup') }}</button>
    </form>
    <p class="small muted mt center">Already have an account? <a href="{{ url_for('login') }}">{{ t('nav.login') }}</a></p>
  </div>
</div>
{% endblock %}
